[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nurse-match-engine"
version = "0.1.0"
description = "Rank home-care nurses for a care request: hard rules, scored factors, plain-language explanations."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.50", "httpx>=0.27"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["matcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
